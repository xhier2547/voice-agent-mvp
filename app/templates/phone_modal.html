<!-- iOS Phone Call Simulator Component -->
<style>
    /* iOS Phone Call Simulator Overlay */
    .phone-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(8px);
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: flex-start;
        padding-left: max(20px, calc(50vw - 580px));
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    @media (max-width: 900px) {
        .phone-modal-overlay {
            justify-content: center;
            padding-left: 0;
        }
    }

    .phone-modal-overlay.active {
        display: flex;
        opacity: 1;
        pointer-events: auto;
    }

    .iphone-shell {
        width: 360px;
        height: 720px;
        background: #0f172a;
        border-radius: 44px;
        padding: 10px;
        box-shadow: 0 25px 80px rgba(15, 23, 42, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        position: relative;
        transform: scale(0.9);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
        pointer-events: auto;
    }

    .phone-modal-overlay.active .iphone-shell {
        transform: scale(1);
    }

    .phone-inner-screen {
        width: 100%;
        height: 100%;
        border-radius: 36px;
        background: linear-gradient(165deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px 20px 24px 20px;
        color: white;
        position: relative;
        overflow: hidden;
    }

    .phone-notch-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
        padding: 0 8px;
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.9);
    }

    .notch-pill {
        width: 110px;
        height: 22px;
        background: #000;
        border-bottom-left-radius: 14px;
        border-bottom-right-radius: 14px;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
    }

    .phone-caller-header {
        margin-top: 36px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 0 4px;
    }

    .caller-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .caller-name-text {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.5px;
        color: #ffffff;
    }

    .caller-status-time {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        gap: 6px;
        font-variant-numeric: tabular-nums;
    }

    .caller-avatar-circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        overflow: hidden;
    }

    .phone-chat-preview {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 12px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.95);
        max-height: 90px;
        overflow-y: auto;
        margin: 10px 0;
    }

    .phone-actions-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px 12px;
        margin-bottom: 16px;
    }

    .phone-action-btn-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }

    .phone-action-circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .phone-action-circle:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
    }

    .phone-action-circle.active {
        background: white;
        color: #0f172a;
        border-color: white;
    }

    .phone-action-label {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.8);
    }

    .phone-hangup-row {
        display: flex;
        justify-content: center;
        margin-bottom: 8px;
    }

    .phone-hangup-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #ef4444;
        border: none;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        transition: all 0.2s ease;
    }

    .phone-hangup-btn:hover {
        transform: scale(1.08);
        background: #dc2626;
    }

    .phone-home-indicator {
        width: 120px;
        height: 4px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 2px;
        margin: 0 auto;
    }
</style>
